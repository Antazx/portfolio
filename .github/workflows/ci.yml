name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: zj8qwjc2
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typegen
      - run: git diff --exit-code -- web/sanity.types.ts
      - run: pnpm build
      - run: pnpm build:studio
      - run: pnpm --filter portfolio-web exec playwright install --with-deps chromium
      - run: pnpm audit:a11y
